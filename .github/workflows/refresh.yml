name: refresh identity

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/refresh.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py

      - name: Commit if the public record changed
        run: |
          if git diff --quiet -- index.html llms.txt repos.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html llms.txt repos.json
          git commit -m "refresh: regenerate identity from GitHub API"
          git push
